[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emergency-backend"
version = "0.2.0"
description = "Stateless 119 emergency call analysis API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.22,<1",
  "google-genai>=1.50,<3",
  "httpx>=0.28,<1",
  "av>=14,<20",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1,<2"]
symptom = ["torch>=2.6,<3", "transformers>=4.48,<5"]
speaker = ["faster-whisper>=1.1,<2", "torch>=2.6,<3", "transformers>=4.48,<5"]
rag = [
  "PyMuPDF>=1.25,<2", "chromadb>=1.0,<2", "sentence-transformers>=3.4,<6",
  "langchain-core>=1.2,<2", "langchain-google-genai>=4.0,<5",
]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
